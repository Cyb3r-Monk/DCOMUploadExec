name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-main:
    name: Build DCOMUploadExec
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build main project
        run: msbuild DCOMUploadExec.sln /m /p:Configuration=Release /p:Platform=x64 /t:DCOMUploadExec

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcomuploadexec-x64
          path: |
            x64/Release/DCOMUploadExec.exe
            x64/Release/DCOMUploadExec.pdb
          if-no-files-found: error

  build-assemblypayload:
    name: Build AssemblyPayload
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore AssemblyPayload packages
        run: nuget restore DCOMUploadExec.sln

      - name: Build AssemblyPayload with hosted MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSBuild and VC tools was not found."
          }

          $vcToolsVersionDir = Get-ChildItem (Join-Path $vsPath "VC\Tools\MSVC") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vcToolsVersionDir) {
            throw "Could not locate the VC tools directory under '$vsPath'."
          }

          $libToolPath = Join-Path $vcToolsVersionDir.FullName "bin\Hostx64\x64"
          if (-not (Test-Path (Join-Path $libToolPath "lib.exe"))) {
            throw "lib.exe was not found at '$libToolPath'."
          }

          msbuild "AssemblyPayload\AssemblyPayload.csproj" /m /p:Configuration=Release /p:Platform=AnyCPU /p:DllExportTargetFrameworkVersion=v4.0 /p:DllExportLibToolPath="$libToolPath" /p:DllExportLibToolDllPath="$libToolPath"

      - name: Upload AssemblyPayload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assemblypayload
          path: |
            AssemblyPayload/bin/Release/payload.dll
            AssemblyPayload/bin/Release/payload.pdb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-main
      - build-assemblypayload
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download main artifact
        uses: actions/download-artifact@v4
        with:
          name: dcomuploadexec-x64
          path: artifacts/dcomuploadexec-x64

      - name: Download payload artifact
        uses: actions/download-artifact@v4
        with:
          name: assemblypayload
          path: artifacts/assemblypayload

      - name: Package release artifacts
        run: |
          cd artifacts
          zip -r ../DCOMUploadExec-${{ github.ref_name }}-x64.zip dcomuploadexec-x64
          zip -r ../AssemblyPayload-${{ github.ref_name }}.zip assemblypayload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DCOMUploadExec-${{ github.ref_name }}-x64.zip
            AssemblyPayload-${{ github.ref_name }}.zip
