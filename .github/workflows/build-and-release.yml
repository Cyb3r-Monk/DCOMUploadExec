name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (for example, v1.0.0)"
        required: true
        type: string

jobs:
  build-main:
    name: Build DCOMUploadExec
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build main project
        run: msbuild DCOMUploadExec.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /t:DCOMUploadExec

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcomuploadexec-x64
          path: |
            x64/Release/DCOMUploadExec.exe
            x64/Release/DCOMUploadExec.pdb
          if-no-files-found: error

  build-assemblypayload:
    name: Build AssemblyPayload
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore AssemblyPayload packages
        run: nuget restore DCOMUploadExec.sln

      - name: Build AssemblyPayload with hosted MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSBuild and VC tools was not found."
          }

          $vcToolsVersionDir = Get-ChildItem (Join-Path $vsPath "VC\Tools\MSVC") -Directory | Where-Object { $_.Name -like "14.29*" } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vcToolsVersionDir) {
            throw "Could not locate MSVC 14.29 x64/x86 build tools under '$vsPath'."
          }

          $libToolPathX64 = Join-Path $vcToolsVersionDir.FullName "bin\Hostx64\x64"
          $libToolPathX86 = Join-Path $vcToolsVersionDir.FullName "bin\Hostx86\x86"
          if (-not (Test-Path (Join-Path $libToolPathX64 "lib.exe"))) {
            throw "x64 lib.exe was not found at '$libToolPathX64'."
          }
          if (-not (Test-Path (Join-Path $libToolPathX86 "lib.exe"))) {
            throw "x86 lib.exe was not found at '$libToolPathX86'."
          }

          $env:PATH = "$libToolPathX64;$libToolPathX86;$env:PATH"
          msbuild "AssemblyPayload\AssemblyPayload.csproj" /m /p:Configuration=Release /p:Platform=x64 /p:DllExportTargetFrameworkVersion=v4.0 /p:DllExportLibToolPath="$libToolPathX64" /p:DllExportLibToolDllPath="$libToolPathX64" /p:VCToolsVersion="$($vcToolsVersionDir.Name)"

      - name: Upload AssemblyPayload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assemblypayload
          path: |
            AssemblyPayload/bin/Release/payload.dll
            AssemblyPayload/bin/Release/payload.pdb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-main
      - build-assemblypayload
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Download main artifact
        uses: actions/download-artifact@v4
        with:
          name: dcomuploadexec-x64
          path: artifacts/dcomuploadexec-x64

      - name: Download payload artifact
        uses: actions/download-artifact@v4
        with:
          name: assemblypayload
          path: artifacts/assemblypayload

      - name: Package release artifacts
        run: |
          cd artifacts
          zip -r ../DCOMUploadExec-${{ env.RELEASE_TAG }}-x64.zip dcomuploadexec-x64
          zip -r ../AssemblyPayload-${{ env.RELEASE_TAG }}.zip assemblypayload

      - name: Publish release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            DCOMUploadExec-${{ env.RELEASE_TAG }}-x64.zip
            AssemblyPayload-${{ env.RELEASE_TAG }}.zip

      - name: Publish release (tag push)
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            DCOMUploadExec-${{ env.RELEASE_TAG }}-x64.zip
            AssemblyPayload-${{ env.RELEASE_TAG }}.zip
